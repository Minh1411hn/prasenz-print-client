name: Build Windows

on:
  pull_request:
    paths:
      - 'src-windows/**'
      - 'contracts/**'
      - 'scripts/build-windows*'
      - 'scripts/fetch-windows-deps.ps1'
      - 'scripts/windows-dependencies.json'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
    inputs:
      package:
        description: 'Fetch pinned dependencies and create the ZIP'
        required: true
        default: false
        type: boolean
  push:
    tags: ['windows-v*']

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: src-windows/global.json
      - run: dotnet build src-windows/PrasenzPrinter.sln -c Release
      - run: dotnet run --project src-windows/PrasenzPrinter.Core.Tests/PrasenzPrinter.Core.Tests.csproj -c Release
      - run: dotnet run --project src-windows/PrasenzPrinter.Windows.Tests/PrasenzPrinter.Windows.Tests.csproj -c Release

  package:
    if: startsWith(github.ref, 'refs/tags/windows-v') || (github.event_name == 'workflow_dispatch' && inputs.package)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: src-windows/global.json
      - run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PrasenzPrinter-windows-win-x64
          path: dist/PrasenzPrinter-windows-win-x64.zip
